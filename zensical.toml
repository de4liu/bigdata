[project]
site_url = "https://de4liu.github.io/bigdata/"
site_name = "MSBA 6331 Big Data Analytics"
site_description = "Public homepage for MSBA 6331 Big Data Analytics at the Carlson School of Management, University of Minnesota: course resources, FAQs, and student guides."
site_author = "De Liu"

copyright = 'Copyright &copy; 2026 <a href="https://github.com/de4liu" target="_blank" rel="noopener">De Liu</a>'

nav = [
  { "Home" = "index.md" },
  { "FAQs" = [
    { "Embed Images in Notebooks" = "FAQs/addimage.md" },
    { "Git Cheatsheet" = "FAQs/cheatsheet_git.md" },
    { "Config Git" = "FAQs/configGit.md" },
    { "Debug MapReduce Jobs" = "FAQs/debug_hadoop.md" },
    { "Debug Hadoop Streaming Jobs" = "FAQs/debug_hadoop_streaming.md" },
    { "Edit files in Linux" = "FAQs/edit_linux_file.md" },
    { "Fix Hive metastore db error" = "FAQs/hive_debug.md" },
    { "Homework Submission Guidelines-guidelines" = "FAQs/homework-guidelines.md" },
    { "Install Spark Locally on your Own Computer" = "FAQs/installLocalSpark.md" },
    { "Issues with Line Endings in Text Files" = "FAQs/line_endings.md" },
    { "Convert Markdown to PDF" = "FAQs/markdown2pdf.md" },
    { "Mount s3 folder to databricks" = "FAQs/mounts3.md" },
    { "Common Issues with PySpark" = "FAQs/sparkfaq.md" },
    { "Recommended Text Editors for Scripting & Text File Handling" = "FAQs/textEditor.md" },
    { "View Delimiters and Invisible Characters" = "FAQs/viewdelimiters.md" },
    { "Windows Commands 101" = "FAQs/windows_cmd.md" },
  ] },
  { "Course Setup" = [
    { "Pre-work" = "prework.md" },
    { "Git Lab Prework" = "git_prework.md" },
    { "Homework Guidelines" = "homework-guidelines.md" },
  ] },
  { "Trends" = [
    { "Trends Market" = "trendsMarket.md" },
    { "Trends Student Guide" = "trends-guide-students.md" },
    { "Trends Guest Guide" = "trends-guest-guide.md" },
  ] },
  { "Resources" = [
    { "Public Datasets" = "datasets.md" },
    { "Kion Cloud Portal" = "kion.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
favicon = "assets/favicon.ico"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
